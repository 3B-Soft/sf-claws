name: CI
on: [push, pull_request]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version-file: .bun-version }
      - run: bun install --frozen-lockfile

      # Lint and typecheck are separate steps: a failure should say which gate broke, and a
      # workspace whose bundler tolerates a type error must still fail the build.
      - name: Lint and format check
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck

      - run: bun run build
      - run: bun run test

      - uses: actions/upload-artifact@v4
        with: { name: extension, path: packages/extension/release/sf-claws.zip, if-no-files-found: ignore }

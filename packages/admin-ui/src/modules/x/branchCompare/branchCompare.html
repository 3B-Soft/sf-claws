<template lwc:render-mode="light">
  <div class="card mb-4 flex flex-wrap items-end gap-3 p-4">
    <div class="w-56"><x-form-field label="Base" name="base" type="select" value={baseValue} options={branches} placeholder="— base —" compact onchange={handleBase}></x-form-field></div>
    <span class="pb-2 text-content-subtle">←</span>
    <div class="w-56"><x-form-field label="Head" name="head" type="select" value={headValue} options={branches} placeholder="— head —" compact onchange={handleHead}></x-form-field></div>
    <button class="btn-primary btn-sm" onclick={run} disabled={cannotRun}><template lwc:if={loading}><x-icon name="spinner" cls="h-3.5 w-3.5"></x-icon></template>Compare</button>
    <template lwc:if={result}><span class="ml-auto text-xs text-content-muted">{summary} · <span class="font-mono text-emerald-700">+{totalAdd}</span> <span class="font-mono text-rose-700">−{totalDel}</span> · <a href={compareUrl} target="_blank" rel="noopener" class="link">open on GitHub</a></span></template>
  </div>
  <template lwc:if={error}><x-error-state error={error} onretry={run}></x-error-state></template>
  <template lwc:elseif={loading}><x-skeleton variant="text" rows="8"></x-skeleton></template>
  <template lwc:elseif={hasFiles}>
    <div class="mb-2 flex justify-end gap-1"><button class="btn-ghost btn-xs" onclick={expandAll}>Expand all</button><button class="btn-ghost btn-xs" onclick={collapseAll}>Collapse all</button></div>
    <div class="space-y-2">
      <template for:each={files} for:item="f">
        <div key={f.id} class="card overflow-hidden">
          <button class="flex w-full items-center gap-3 px-4 py-2.5 text-left hover:bg-surface-sunken" data-path={f.path} onclick={toggle}>
            <x-icon name={f.chevron} cls="h-4 w-4 text-content-subtle"></x-icon>
            <x-badge value={f.status} color={f.statusColor}></x-badge>
            <span class="mono min-w-0 flex-1 truncate text-content-strong">{f.path}</span>
            <template lwc:if={f.component}><span class="hidden text-xs text-content-subtle sm:inline">{f.component}</span></template>
            <span class="font-mono text-xs text-emerald-700">+{f.additions}</span><span class="font-mono text-xs text-rose-700">−{f.deletions}</span>
          </button>
          <template lwc:if={f.open}>
            <div class="border-t border-line p-2">
              <template lwc:if={f.hasPatch}><x-diff-viewer patch={f.patch} path={f.path}></x-diff-viewer></template>
              <template lwc:else><div class="p-3 text-center text-xs text-content-subtle">No textual diff available (binary or too large).</div></template>
            </div>
          </template>
        </div>
      </template>
    </div>
  </template>
  <template lwc:elseif={result}><x-empty-state icon="git" title="Branches are identical" description="No file differences between base and head."></x-empty-state></template>
  <template lwc:else><x-empty-state icon="git" title="Pick two branches to compare" description="Visual per-file diffs of the metadata the harness committed."></x-empty-state></template>
</template>

<template lwc:render-mode="light">
  <div class={cls}>
    <div class="flex flex-wrap items-center gap-2"><x-icon name={icon} cls={iconCls}></x-icon><span class="text-sm font-semibold text-content-strong">{title}</span><x-badge value={statusLabel}></x-badge><template lwc:if={sfId}><span class="mono ml-auto text-content-subtle">{sfId}</span></template></div>
    <div class="mt-3 grid grid-cols-2 gap-3 sm:grid-cols-5">
      <div><div class="text-[11px] uppercase tracking-wide text-content-subtle">Components OK</div><div class="text-lg font-semibold text-emerald-700">{componentsOk}</div></div>
      <div><div class="text-[11px] uppercase tracking-wide text-content-subtle">Components failed</div><div class={compFailedCls}>{d.componentsFailed}</div></div>
      <div><div class="text-[11px] uppercase tracking-wide text-content-subtle">Tests OK</div><div class="text-lg font-semibold text-emerald-700">{testsOk}</div></div>
      <div><div class="text-[11px] uppercase tracking-wide text-content-subtle">Tests failed</div><div class={testsFailedCls}>{d.testsFailed}</div></div>
      <div><div class="text-[11px] uppercase tracking-wide text-content-subtle">Coverage</div><div class={coverageCls}>{coverage}</div></div>
    </div>
    <template lwc:if={hasFailures}>
      <div class="mt-3 overflow-x-auto rounded-lg border border-rose-500/20 bg-canvas">
        <table class="table"><thead><tr><th>Type</th><th>Component</th><th>Line</th><th>Problem</th></tr></thead>
          <tbody><template for:each={failures} for:item="f"><tr key={f.id}><td class="text-rose-700">{f.componentType}</td><td class="mono">{f.name}</td><td class="mono text-content-muted">{f.loc}</td><td class="text-rose-700">{f.problem}<template lwc:if={f.problemType}><span class="ml-2 text-[10px] uppercase text-rose-700">{f.problemType}</span></template></td></tr></template></tbody>
        </table>
      </div>
    </template>
  </div>
</template>

<template lwc:render-mode="light">
  <div class="flex flex-col items-center justify-center rounded-xl border border-dashed border-line px-6 py-12 text-center">
    <div class="mb-3 flex h-11 w-11 items-center justify-center rounded-full bg-surface-sunken text-content-muted"><x-icon name={icon} cls="h-5 w-5"></x-icon></div>
    <h3 class="text-sm font-semibold text-content">{title}</h3>
    <template lwc:if={description}><p class="mt-1 max-w-sm text-sm text-content-muted">{description}</p></template>
    <template lwc:if={actionLabel}><button class="btn-primary btn-sm mt-4" onclick={handleAction}>{actionLabel}</button></template>
  </div>
</template>

<template lwc:render-mode="light">
  <x-page-header title="Clients" subtitle="Each client has its own Salesforce orgs, GitHub repository, skills and policies.">
    <div class="w-56"><x-form-field name="search" placeholder="Search clients…" value={search} compact onchange={handleSearch}></x-form-field></div>
    <button class="btn-primary btn-sm" onclick={openCreate}><x-icon name="plus" cls="h-3.5 w-3.5"></x-icon>New client</button>
  </x-page-header>
  <template lwc:if={error}><x-error-state error={error} onretry={load}></x-error-state></template>
  <template lwc:elseif={loading}><x-skeleton variant="cards" rows="6"></x-skeleton></template>
  <template lwc:elseif={isEmpty}><x-empty-state icon="clients" title="No clients yet" description="Create your first client, then connect its Salesforce orgs and GitHub repo." action-label="New client" onaction={openCreate}></x-empty-state></template>
  <template lwc:elseif={hasRows}>
    <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <template for:each={rows} for:item="c">
        <a key={c.id} href={c.href} class="card card-pad group flex items-start gap-3 transition-colors hover:border-brand-500/40 hover:bg-surface">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-sm font-bold text-brand-700">{c.initials}</span>
          <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold text-content-strong group-hover:text-brand-700">{c.name}</span><span class="mono block text-content-subtle">{c.slug}</span><template lwc:if={c.description}><span class="mt-1 line-clamp-2 block text-xs text-content-muted">{c.description}</span></template><span class="mt-2 block text-[11px] text-content-subtle">Created {c.when}</span></span>
          <x-icon name="chevronRight" cls="h-4 w-4 text-content-subtle group-hover:text-brand-600"></x-icon>
        </a>
      </template>
    </div>
  </template>
  <template lwc:else><x-empty-state icon="search" title="No clients match your search"></x-empty-state></template>

  <x-modal open={modalOpen} title="New client" subtitle="A client groups Salesforce orgs, a GitHub repo, skills and policies." size="sm" onclose={closeCreate}>
    <x-form-field label="Name" name="name" value={form.name} placeholder="Acme Corp" required onchange={handleField}></x-form-field>
    <x-form-field label="Slug" name="slug" value={form.slug} placeholder="acme-corp" hint="Used in URLs and branch names." error={slugError} mono required onchange={handleField}></x-form-field>
    <x-form-field label="Description" name="description" type="textarea" rows="3" value={form.description} placeholder="What we do for this client…" onchange={handleField}></x-form-field>
    <x-form-field type="toggle" label="Use the user's Salesforce browser session" name="useBrowserSession" value={form.useBrowserSession} hint="Off uses a Salesforce External Client App with OAuth and refresh tokens." onchange={handleField}></x-form-field>
    <template lwc:if={browserSessionMode}>
      <div class="rounded-lg border border-amber-400/40 bg-amber-50 px-3 py-3 text-xs text-amber-900">
        <p class="font-semibold">Browser-session mode has important limitations</p>
        <p class="mt-1">The extension reads the active Salesforce <span class="mono">sid</span> cookie and sends it to this SF Claws server. It has the same access as the signed-in user, expires on logout or timeout, cannot be refreshed, and must be supplied again after a server restart. Only one Salesforce browser identity can supply an org at a time. Work may stop if the session expires.</p>
      </div>
    </template>
    <template lwc:else>
      <div class="rounded-lg border border-sky-400/30 bg-sky-50 px-3 py-3 text-xs text-sky-900">External Client App mode is recommended for reliable long-running and resumable work. Each org is connected through OAuth with PKCE.</div>
    </template>
    <div slot="footer"><button class="btn-secondary" onclick={closeCreate}>Cancel</button><button class="btn-primary" onclick={create} disabled={cannotCreate}>Create client</button></div>
  </x-modal>
</template>

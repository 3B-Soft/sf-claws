<template lwc:render-mode="light">
  <div class="mx-auto max-w-lg py-10">
    <div class="card p-8 text-center">
      <template lwc:if={ok}>
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-emerald-500/15 text-emerald-700"><x-icon name="check" cls="h-6 w-6"></x-icon></div>
        <h1 class="text-lg font-semibold text-content-strong">Salesforce org connected</h1>
        <p class="mt-2 text-sm text-content-muted">The harness can now read and deploy metadata on <span class="text-content">{orgLabel}</span>.</p>
      </template>
      <template lwc:else>
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-rose-500/15 text-rose-700"><x-icon name="error" cls="h-6 w-6"></x-icon></div>
        <h1 class="text-lg font-semibold text-content-strong">Connection failed</h1>
        <p class="mt-2 text-sm text-content-muted">Salesforce did not authorize the harness.</p>
        <template lwc:if={message}><div class="mt-3 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-left text-sm text-rose-700 break-words">{message}</div></template>
      </template>
      <div class="mt-6 flex flex-wrap justify-center gap-2">
        <template lwc:if={clientHref}><a href={clientHref} class="btn-primary">Open client orgs</a></template>
        <template lwc:else><a href="#/clients" class="btn-primary">Go to clients</a></template>
        <template lwc:if={isPopup}><button class="btn-secondary" onclick={closeWindow}>Close this window</button></template>
      </div>
    </div>
  </div>
</template>

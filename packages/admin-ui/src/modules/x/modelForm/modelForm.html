<template lwc:render-mode="light">
  <template lwc:if={form}>
    <template lwc:if={showPresets}>
      <div class="mb-4"><div class="label">Quick fill</div><div class="flex flex-wrap gap-1.5"><template for:each={presets} for:item="p"><button key={p.id} class={p.cls} title={p.title} data-id={p.id} onclick={applyPreset}>{p.label}</button></template></div></div>
    </template>
    <div class="grid gap-x-4 sm:grid-cols-2">
      <x-form-field label="Provider" name="provider" type="select" value={f.provider} options={providerOptions} onchange={handle}></x-form-field>
      <x-form-field label="Model id" name="modelId" value={f.modelId} placeholder="claude-sonnet-5" mono required onchange={handle}></x-form-field>
      <x-form-field label="Label" name="label" value={f.label} placeholder="Claude Sonnet 5" required onchange={handle}></x-form-field>
      <div></div>
      <x-form-field label="Input $ / 1M tokens" name="inputCostPerM" type="number" step="0.01" min="0" value={f.inputCostPerM} onchange={handle}></x-form-field>
      <x-form-field label="Output $ / 1M tokens" name="outputCostPerM" type="number" step="0.01" min="0" value={f.outputCostPerM} onchange={handle}></x-form-field>
      <x-form-field label="Cached input $ / 1M (optional)" name="cachedInputCostPerM" type="number" step="0.001" min="0" value={cached} onchange={handle}></x-form-field>
      <x-form-field label="Max output tokens" name="maxOutputTokens" type="number" step="1000" min="1" value={f.maxOutputTokens} onchange={handle}></x-form-field>
      <x-form-field label="Context window" name="contextWindow" type="number" step="1000" min="1" value={f.contextWindow} onchange={handle}></x-form-field>
    </div>
    <template lwc:if={placeholderNote}><p class="mb-3 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-xs text-amber-700">{placeholderNote}</p></template>
    <div class="grid gap-2 sm:grid-cols-2">
      <x-form-field type="checkbox" label="Enabled" name="enabled" value={f.enabled} hint="Disabled models cannot be bound to roles." compact onchange={handle}></x-form-field>
      <x-form-field type="checkbox" label="Supports thinking" name="supportsThinking" value={f.supportsThinking} hint="Extended reasoning / effort levels. Effort itself is set per agent role in the role bindings below." compact onchange={handle}></x-form-field>
    </div>
    <div class="divider my-3"></div>
    <h4 class="mb-1 text-xs font-semibold uppercase tracking-wide text-content-muted">Sampling</h4>
    <p class="mb-3 text-xs text-content-muted">{samplingHint}</p>
    <div class="grid gap-x-4 sm:grid-cols-2">
      <x-form-field label="Temperature" name="temperature" type="number" min="0" max="2" step="0.1" value={temperature} placeholder="provider default" hint="Blank = provider default. Lower is more repeatable." disabled={dialsDisabled} onchange={handle}></x-form-field>
      <x-form-field label="Top P" name="topP" type="number" min="0" max="1" step="0.05" value={topP} placeholder="provider default" hint="Blank = provider default. Set one of these, not both." disabled={dialsDisabled} onchange={handle}></x-form-field>
    </div>
    <div class="mt-5 flex justify-end gap-2"><button class="btn-secondary" onclick={cancel}>Cancel</button><button class="btn-primary" onclick={submit} disabled={cannotSubmit}>Save model</button></div>
  </template>
</template>

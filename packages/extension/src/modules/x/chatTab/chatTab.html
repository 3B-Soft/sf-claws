<template lwc:render-mode="light">
  <template lwc:if={hasSession}>
    <x-chat-thread class="contents" onshowlist={onShowList} onnewsession={onNew}></x-chat-thread>
  </template>
  <template lwc:else>
    <x-session-list class="contents" onselect={onSelect} onnew={onNew} creating={creating} error={error} canback={hasBack}></x-session-list>
  </template>
</template>

<template lwc:render-mode="light">
  <div class={cardCls}>
    <div class="flex items-center gap-2">
      <span class={kindCls}>{kindText}</span>
      <span class="min-w-0 flex-1 truncate text-[13px] font-semibold text-content-strong" title={title}>{title}</span>
    </div>

    <template lwc:if={hasImpact}>
      <div class="mt-2 rounded-lg border border-amber-500/40 bg-amber-500/10 px-2 py-1.5">
        <div class="text-[10px] font-semibold uppercase tracking-wide text-amber-700">Who this affects</div>
        <div class="mt-0.5 whitespace-pre-wrap text-[12px] leading-relaxed text-content">{impact}</div>
      </div>
    </template>

    <template lwc:if={isCommand}>
      <div class="mt-2 space-y-2">
        <div>
          <div class="text-[10px] font-semibold uppercase tracking-wide text-brand-600">Why</div>
          <div class="mt-0.5 whitespace-pre-wrap text-[12px] leading-relaxed text-content">{description}</div>
        </div>
        <div>
          <div class="text-[10px] font-semibold uppercase tracking-wide text-brand-600">What</div>
          <div class="mt-0.5 flex items-center gap-2">
            <span class="rounded-md border border-line-strong bg-canvas px-1.5 py-0.5 font-mono text-[11px] text-content-strong">{commandName}</span>
            <template lwc:if={sessionAllowable}><span class="text-[10px] text-content-subtle">can be allowed for the whole session</span></template>
          </div>
          <template lwc:if={isApex}>
            <pre class="mt-1.5 max-h-64 overflow-auto rounded-lg border border-line bg-canvas p-2 font-mono text-[11px] leading-[1.45] text-amber-700">{apexCode}</pre>
          </template>
          <template lwc:elseif={isSoqlCommand}>
            <pre class="mt-1.5 max-h-40 overflow-auto whitespace-pre-wrap rounded-lg border border-line bg-canvas p-2 font-mono text-[11px] text-sky-700">{soqlText}</pre>
          </template>
          <template lwc:if={hasInputRows}>
            <dl class="mt-1.5 divide-y divide-line rounded-lg border border-line bg-canvas text-[11px]">
              <template for:each={inputRows} for:item="r">
                <div key={r.key} class="flex gap-2 px-2 py-1"><dt class="w-28 shrink-0 truncate font-mono text-content-subtle" title={r.label}>{r.label}</dt><dd class="min-w-0 flex-1 break-words text-content-strong">{r.value}</dd></div>
              </template>
            </dl>
          </template>
          <template lwc:if={inputIsArray}>
            <ul class="mt-1.5 space-y-0.5 rounded-lg border border-line bg-canvas px-2 py-1 text-[11px] text-content-strong">
              <template for:each={inputArray} for:item="r"><li key={r.key} class="truncate">{r.text}</li></template>
            </ul>
          </template>
          <template lwc:if={inputIsScalar}><div class="mt-1.5 rounded-lg border border-line bg-canvas px-2 py-1 font-mono text-[11px] text-content-strong">{inputScalar}</div></template>
          <template lwc:if={pro}><details class="mt-1.5"><summary class="cursor-pointer text-[10px] text-content-subtle hover:text-content">raw input</summary><x-xml-view json={commandInput} max-height="220px"></x-xml-view></details></template>
        </div>
      </div>
    </template>
    <template lwc:elseif={isPlan}>
      <div class="mt-2 space-y-2">
        <template lwc:if={description}><div class="whitespace-pre-wrap text-[12px] font-medium leading-relaxed text-violet-700">{description}</div></template>
        <div class="rounded-lg border border-violet-500/25 bg-canvas p-2">
          <x-markdown-view text={planMarkdown}></x-markdown-view>
        </div>
        <template lwc:if={planRevision}><div class="text-[10px] uppercase tracking-wide text-violet-700/70">{planRevision}</div></template>
        <p class="text-[11px] text-content-muted">Nothing is built or changed in Salesforce until you approve this.</p>
      </div>
    </template>

    <template lwc:elseif={isQuestion}>
      <div class="mt-2 space-y-2">
        <template lwc:if={hasOptionDetails}>
          <dl class="divide-y divide-line rounded-lg border border-line bg-canvas text-[11px]">
            <template for:each={questionOptions} for:item="o">
              <div key={o.key} class="px-2 py-1.5"><dt class="font-medium text-content">{o.label}</dt><dd class="mt-0.5 text-content-muted">{o.detail}</dd></div>
            </template>
          </dl>
        </template>
        <template lwc:if={allowsFreeText}>
          <template lwc:if={unresolved}>
            <input data-answer type="text" placeholder="…or type your own answer, then pick an option"
              class="w-full rounded-lg border border-line-strong bg-canvas px-2 py-1.5 text-[12px] text-content-strong placeholder:text-content-subtle focus:border-cyan-500 focus:outline-none" />
          </template>
        </template>
      </div>
    </template>

    <template lwc:else>
      <template lwc:if={description}><div class="mt-1.5 whitespace-pre-wrap text-[12px] text-content">{description}</div></template>
      <template lwc:if={hasDetails}>
        <dl class="mt-2 divide-y divide-line rounded-lg border border-line bg-canvas text-[11px]">
          <template for:each={details} for:item="d">
            <div key={d.key} class="flex gap-2 px-2 py-1"><dt class="w-28 shrink-0 truncate text-content-subtle">{d.label}</dt><dd class="min-w-0 flex-1 break-words text-content">{d.value}</dd></div>
          </template>
        </dl>
      </template>
      <template lwc:if={pro}><template lwc:if={hasRawDetails}><div class="mt-2"><x-xml-view json={item.details} max-height="200px"></x-xml-view></div></template></template>
    </template>

    <template lwc:if={resolved}>
      <div class="mt-2 text-[11px] text-content-muted">You chose <span class="font-medium text-content">{resolvedLabel}</span></div>
    </template>
    <template lwc:else>
      <div class="mt-3 flex flex-wrap gap-2">
        <template for:each={options} for:item="o">
          <button key={o.id} class={o.cls} data-id={o.id} disabled={busy} onclick={onPick}>{o.label}</button>
        </template>
      </div>
    </template>
  </div>
</template>

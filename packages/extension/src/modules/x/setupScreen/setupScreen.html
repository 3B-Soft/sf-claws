<template lwc:render-mode="light">
  <div class="flex flex-1 flex-col overflow-y-auto px-5 py-8">
    <div class="mx-auto w-full max-w-sm">
      <div class="mb-6 flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-500 text-sm font-black tracking-tight text-white shadow-lg shadow-content-strong/10">x3</div>
        <div>
          <div class="text-base font-semibold text-content-strong">SF Claws</div>
          <div class="text-[12px] text-content-muted">Salesforce admin copilot</div>
        </div>
      </div>

      <div class="rounded-2xl border border-line bg-surface p-4 shadow-xl">
        <h2 class="text-sm font-semibold text-content-strong">Connect to your control plane</h2>
        <p class="mt-1 text-[12px] leading-relaxed text-content-muted">Enter the SF Claws server URL your admin gave you. It is stored in your Chrome profile and synced across devices.</p>

        <label class="mt-4 block text-[11px] font-medium uppercase tracking-wide text-content-muted">Server URL</label>
        <input class="mt-1 w-full rounded-lg border border-line-strong bg-canvas px-3 py-2 text-[13px] text-content-strong placeholder-content-subtle outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30"
               type="url" placeholder="https://harness.yourcompany.com" value={url} oninput={onInput} onkeydown={onKey} autocomplete="url" spellcheck="false" />

        <template lwc:if={isChrome}>
          <p class="mt-2 text-[11px] text-content-subtle">Chrome will ask permission to let the extension talk to this host.</p>
        </template>

        <template lwc:if={error}>
          <div class="mt-3 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-[12px] text-rose-700">{error}</div>
        </template>

        <template lwc:if={healthOk}>
          <div class="mt-3 flex items-center gap-2 rounded-lg border border-emerald-500/30 bg-emerald-500/10 px-3 py-2 text-[12px] text-emerald-700">
            <span class="h-2 w-2 rounded-full bg-emerald-400"></span>
            <span>Server reachable <span class="text-emerald-700/80">{healthVersion}</span></span>
            <template lwc:if={setupRequired}><span class="ml-auto rounded bg-amber-500/20 px-1.5 text-[10px] text-amber-700">setup required</span></template>
          </div>
        </template>

        <button class="mt-4 w-full rounded-lg bg-brand-500 px-3 py-2 text-[13px] font-semibold text-white shadow hover:bg-brand-500 disabled:cursor-not-allowed disabled:opacity-50"
                disabled={disabledContinue} onclick={onContinue}>{buttonLabel}</button>
      </div>

      <p class="mt-5 text-center text-[11px] text-content-subtle">Need a server? Ask your SF Claws administrator for the URL and to approve your account.</p>
    </div>
  </div>
</template>

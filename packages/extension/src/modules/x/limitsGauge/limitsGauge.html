<template lwc:render-mode="light">
  <template lwc:if={has}>
    <div class="relative inline-block">
      <button class={chipCls} title={title} onclick={onToggle}>
        <span class="relative inline-block h-3 w-3 rounded-full" style={ringStyle}><span class="absolute inset-[3px] rounded-full bg-surface"></span></span>
        <span>{label}</span>
      </button>
      <template lwc:if={open}>
        <div class="absolute left-0 top-6 z-30 w-72 max-w-[calc(100vw-2rem)] rounded-xl border border-line-strong bg-surface p-3 shadow-2xl">
          <div class="flex items-center gap-2">
            <span class="text-[12px] font-semibold text-content-strong">Org API limits</span>
            <span class="text-[10px] text-content-subtle">{fetched}</span>
            <button class="ml-auto text-[10px] text-content-muted hover:text-content" onclick={onRefresh}>refresh</button>
            <button class="text-[11px] text-content-subtle hover:text-content" onclick={onClose}>✕</button>
          </div>
          <ul class="mt-2 space-y-1.5">
            <template for:each={rows} for:item="l">
              <li key={l.key}>
                <div class="flex items-center gap-2 text-[11px]"><span class="min-w-0 flex-1 truncate text-content">{l.name}</span><span class="truncate text-[10px] text-content-subtle">{l.remaining}</span><span class={l.pctCls}>{l.pct}</span></div>
                <div class="mt-0.5 h-1 overflow-hidden rounded bg-surface-sunken"><div class={l.barCls} style={l.barStyle}></div></div>
              </li>
            </template>
          </ul>
        </div>
      </template>
    </div>
  </template>
  <template lwc:if={hasWarnings}>
    <div class="basis-full rounded-lg border border-amber-500/40 bg-amber-500/10 px-2.5 py-1.5 text-[11px] text-amber-700">
      <div class="flex items-start gap-2">
        <span class="mt-0.5 h-1.5 w-1.5 shrink-0 rounded-full bg-amber-400"></span>
        <div class="min-w-0 flex-1">
          <div class="font-medium">{warningText}</div>
          <ul class="mt-0.5 space-y-0.5 text-amber-700/80"><template for:each={warningRows} for:item="w"><li key={w.key} class="truncate" title={w.text}>{w.text}</li></template></ul>
        </div>
        <button class="rounded px-1 text-amber-700/70 hover:bg-amber-500/20" onclick={onDismiss}>✕</button>
      </div>
    </div>
  </template>
</template>

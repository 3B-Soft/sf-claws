<template lwc:render-mode="light">
  <div class="flex flex-1 flex-col overflow-y-auto px-5 py-8">
    <div class="mx-auto w-full max-w-sm">
      <div class="mb-6 flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-500 text-sm font-black tracking-tight text-white shadow-lg shadow-content-strong/10">x3</div>
        <div>
          <div class="text-base font-semibold text-content-strong">SF Claws</div>
          <div class="truncate text-[12px] text-content-muted">{serverUrl}</div>
        </div>
      </div>

      <template lwc:if={pending}>
        <div class="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-4">
          <div class="flex items-center gap-2">
            <span class="h-2 w-2 rounded-full bg-amber-400 pulse-dot"></span>
            <h2 class="text-sm font-semibold text-amber-700">Waiting for approval</h2>
          </div>
          <p class="mt-2 text-[12px] leading-relaxed text-content">Your account <span class="font-medium text-content-strong">{pendingName}</span> was created and is waiting for a super admin to approve it. You'll be able to use the harness as soon as it's approved.</p>
          <template lwc:if={error}><div class="mt-3 rounded-lg border border-line-strong bg-surface px-3 py-2 text-[12px] text-content">{error}</div></template>
          <div class="mt-4 flex gap-2">
            <button class="flex-1 rounded-lg bg-brand-500 px-3 py-2 text-[12px] font-semibold text-white hover:bg-brand-500 disabled:opacity-50" disabled={busy} onclick={onCheckApproval}>Check again</button>
            <button class="rounded-lg border border-line-strong px-3 py-2 text-[12px] text-content hover:bg-surface-sunken" onclick={onLogout}>Sign out</button>
          </div>
        </div>
      </template>

      <template lwc:if={isDevice}>
        <div class="rounded-2xl border border-line bg-surface p-4 shadow-xl">
          <h2 class="text-sm font-semibold text-content-strong">Pair this extension</h2>
          <p class="mt-1 text-[12px] leading-relaxed text-content-muted">Approve this code in the admin console while signed in. The panel signs in automatically once approved.</p>

          <template lwc:if={code}>
            <div class="mt-4 flex justify-center gap-1.5">
              <template for:each={codeChars} for:item="ch">
                <span key={ch.i} class="flex h-10 w-8 items-center justify-center rounded-lg border border-brand-500/40 bg-canvas font-mono text-lg font-bold text-brand-700 shadow-inner">{ch.c}</span>
              </template>
            </div>
            <template lwc:if={expired}>
              <div class="mt-3 rounded-lg border border-amber-500/30 bg-amber-500/10 px-3 py-2 text-[12px] text-amber-700">This code expired. <button class="underline" onclick={onNewCode}>Get a new code</button></div>
            </template>
            <template lwc:else>
              <div class="mt-3 flex items-center justify-center gap-2 text-[11px] text-content-muted"><span class="h-1.5 w-1.5 rounded-full bg-brand-400 pulse-dot"></span>Waiting for approval…</div>
            </template>
          </template>
          <template lwc:elseif={busy}>
            <div class="mt-4 flex items-center justify-center gap-2 text-[12px] text-content-muted"><span class="h-2 w-2 rounded-full bg-brand-400 pulse-dot"></span>Requesting a pairing code…</div>
          </template>

          <template lwc:if={error}><div class="mt-3 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-[12px] text-rose-700">{error}</div></template>

          <button class="mt-4 w-full rounded-lg bg-brand-500 px-3 py-2 text-[13px] font-semibold text-white shadow hover:bg-brand-500 disabled:cursor-not-allowed disabled:opacity-50" disabled={openDisabled} onclick={onOpenAdmin}>{deviceButtonLabel}</button>
          <div class="mt-3 flex items-center justify-between text-[11px] text-content-muted">
            <button class="hover:text-content" onclick={onNewCode}>New code</button>
            <button class="hover:text-content" onclick={onUsePassword}>Use email &amp; password</button>
          </div>
        </div>
      </template>

      <template lwc:if={isPassword}>
        <div class="rounded-2xl border border-line bg-surface p-4 shadow-xl">
          <h2 class="text-sm font-semibold text-content-strong">Sign in</h2>
          <label class="mt-4 block text-[11px] font-medium uppercase tracking-wide text-content-muted">Email</label>
          <input class="mt-1 w-full rounded-lg border border-line-strong bg-canvas px-3 py-2 text-[13px] text-content-strong outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30" type="email" autocomplete="username" value={email} oninput={onEmail} onkeydown={onKey} />
          <label class="mt-3 block text-[11px] font-medium uppercase tracking-wide text-content-muted">Password</label>
          <input class="mt-1 w-full rounded-lg border border-line-strong bg-canvas px-3 py-2 text-[13px] text-content-strong outline-none focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30" type="password" autocomplete="current-password" value={password} oninput={onPassword} onkeydown={onKey} />
          <template lwc:if={error}><div class="mt-3 rounded-lg border border-rose-500/30 bg-rose-500/10 px-3 py-2 text-[12px] text-rose-700">{error}</div></template>
          <button class="mt-4 w-full rounded-lg bg-brand-500 px-3 py-2 text-[13px] font-semibold text-white shadow hover:bg-brand-500 disabled:cursor-not-allowed disabled:opacity-50" disabled={loginDisabled} onclick={onLogin}>{loginLabel}</button>
          <div class="mt-3 flex items-center justify-between text-[11px] text-content-muted">
            <button class="hover:text-content" onclick={onUseDevice}>Pair with a code instead</button>
          </div>
        </div>
      </template>

      <div class="mt-5 text-center text-[11px] text-content-subtle">
        Wrong server? <button class="underline hover:text-content" onclick={onChangeServer}>Change server URL</button>
      </div>
    </div>
  </div>
</template>
